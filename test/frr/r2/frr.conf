!
! r2 — transitd integration lab (see test/compose.yaml).
!
! Documentation-range values only:
!   ASNs      64496 (RFC 5398 / RFC 6996 doc range)
!   addresses 192.0.2.0/24 (TEST-NET-1, RFC 5737)
!
! The link address is assigned by docker (compose.yaml ipv4_address), so it is
! not repeated here (see test/frr/r1/frr.conf for the rationale).
!
hostname r2
password zebra
log stdout

frr defaults datacenter

router bgp 64496
 bgp router-id 192.0.2.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast

 ! iBGP session to r1.
 neighbor 192.0.2.2 remote-as 64496
 neighbor 192.0.2.2 description r1 (iBGP)
 neighbor 192.0.2.2 update-source 192.0.2.3

 address-family ipv4 unicast
  neighbor 192.0.2.2 activate
 exit-address-family
!

line vty
!
