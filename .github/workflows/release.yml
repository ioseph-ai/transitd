name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Job-scoped permissions: `contents: write` to attach the release, `packages:
    # write` to push the image to GHCR, and `id-token`/`attestations` write for the
    # keyless Sigstore attestations below. The top-level grant stays read-only.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      # dockers_v2 builds the amd64+arm64 manifest with docker buildx, so a
      # buildx builder must exist before GoReleaser runs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # GHCR login for the image push. Same-repository packages accept the
      # workflow's own GITHUB_TOKEN (no PAT secret needed).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keyless Sigstore attestations (no key management): one for the archive
      # checksums, one for the published image digests written by GoReleaser's
      # docker_digest pipe. Verify with `gh attestation verify <file> -R
      # ioseph-ai/transitd` (or the image digest for the second).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt
