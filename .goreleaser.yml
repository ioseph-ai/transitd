version: 2
builds:
  - id: transitd
    main: ./cmd/transitd
    binary: transitd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarm: ["6", "8"]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - id: transitd
    builds: [transitd]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
checksum:
  name_template: checksums.txt
changelog:
  disable: true
