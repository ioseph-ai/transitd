name: ci
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # changes decides whether the integration tier needs to run for this event.
  # On pushes to master everything runs; on pull requests the integration job is
  # path-filtered to changes that can actually affect the compose lab, so a
  # docs-only PR does not pay for a docker lab. dorny/paths-filter is pinned by
  # commit SHA (v3.0.4) — never a floating tag.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            integration:
              - 'internal/**'
              - 'test/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: unit tests (race)
        run: go test -race -count=1 ./...
      - name: coverage
        run: go test -coverprofile=coverage.out ./... >/dev/null && go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.7.0
          args: --timeout=5m

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # integration drives the compose FRR lab (test/compose.yaml) through the
  # `//go:build integration` tests in test/integration. The tests bring the lab
  # up and down themselves, so the job only needs a docker daemon (preinstalled
  # on ubuntu-latest) and the Go toolchain. On master it always runs; on PRs it
  # runs only when the `changes` filter says a relevant path moved.
  integration:
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: docker version
        run: docker version
      - name: integration tests (compose FRR lab)
        run: go test -tags=integration -count=1 -v -timeout 10m ./test/...

  ci:
    needs: [changes, test, lint, vuln, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "test=${{ needs.test.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "vuln=${{ needs.vuln.result }}"
          echo "integration=${{ needs.integration.result }}"
          # changes/test/lint/vuln must be strict successes. changes is checked
          # too: if the path filter itself failed, integration may have been
          # skipped without ever being evaluated, and silently treating that as
          # green would let a broken filter hide the integration tier.
          if [ "${{ needs.changes.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.vuln.result }}" != "success" ]; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
          # integration is path-filtered on PRs: when nothing matched it reports
          # 'skipped', which is a pass here. A failure or cancellation of an
          # integration run that DID happen is still fatal.
          if [ "${{ needs.integration.result }}" != "success" ] && \
             [ "${{ needs.integration.result }}" != "skipped" ]; then
            echo "::error::integration job did not pass (result=${{ needs.integration.result }})"
            exit 1
          fi
          echo "all green"
