!
! r1 — transitd integration lab (see test/compose.yaml).
!
! Documentation-range values only:
!   ASNs      64496 / 64511 (RFC 5398 / RFC 6996 doc ranges)
!   addresses 192.0.2.0/24 (TEST-NET-1) and 203.0.113.0/24 (TEST-NET-3)
!
! Interface addresses on the point-to-point links are assigned by docker
! (compose.yaml ipv4_address) and are NOT re-declared here: docker names the
! links eth0/eth1 and pins the addresses, so duplicating them in FRR only
! risks drifting from compose. This file therefore only owns what docker
! cannot express — the loopback prefix r1 originates, and the BGP sessions.
!
hostname r1
password zebra
log stdout

frr defaults datacenter

!
! Loopback holds the prefix r1 originates into BGP.
interface lo
 ip address 203.0.113.1/32
!

router bgp 64496
 bgp router-id 192.0.2.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast

 ! iBGP session to r2 (r1's address on the r1<->r2 link is 192.0.2.2).
 neighbor 192.0.2.3 remote-as 64496
 neighbor 192.0.2.3 description r2 (iBGP)
 neighbor 192.0.2.3 update-source 192.0.2.2

 ! eBGP session to the exabgp injector (r1's address on that link is 192.0.2.10).
 neighbor 192.0.2.11 remote-as 64511
 neighbor 192.0.2.11 description exabgp (eBGP injector)
 neighbor 192.0.2.11 update-source 192.0.2.10

 address-family ipv4 unicast
  ! r1's own prefix, redistributed to the iBGP peer.
  network 203.0.113.1/32
  neighbor 192.0.2.3 activate
  neighbor 192.0.2.11 activate
 exit-address-family
!

line vty
!
