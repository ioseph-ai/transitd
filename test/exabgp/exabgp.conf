# exabgp route injector for the transitd integration lab (see test/compose.yaml).
#
# Announces 198.51.100.0/24 (TEST-NET-2, RFC 5737 documentation range) with
# AS-PATH [64511 64498] — documentation-range ASNs only (RFC 5398 / RFC 6996).
#
# On the r1<->exa link: this container is 192.0.2.11, r1 is 192.0.2.10.

neighbor 192.0.2.10 {
    router-id 192.0.2.11;
    local-address 192.0.2.11;
    local-as 64511;
    peer-as 64496;

    hold-time 9;

    family {
        ipv4 unicast;
    }

    static {
        route 198.51.100.0/24 next-hop self as-path [ 64511 64498 ];
    }
}
