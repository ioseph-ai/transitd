name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Job-scoped permissions: `contents: write` to attach the release, `packages:
    # write` to push the image to GHCR, and `id-token`/`attestations` write for the
    # keyless Sigstore attestations below. The top-level grant stays read-only.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
      # dockers_v2 builds the amd64+arm64 manifest with docker buildx, so a
      # buildx builder must exist before GoReleaser runs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # GHCR login for the image push. Same-repository packages accept the
      # workflow's own GITHUB_TOKEN (no PAT secret needed).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keyless Sigstore attestations (no key management): one for the archive
      # checksums, one for the published image digests written by GoReleaser's
      # docker_digest pipe. Verify with `gh attestation verify <file> -R
      # ioseph-ai/transitd` (or the image digest for the second).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt
