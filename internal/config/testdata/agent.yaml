# Example transitd configuration. Every address is from an RFC 5737 / RFC 3849
# documentation range; no deployment values appear here.
router_name: r-example

# Gossip health mesh (memberlist). The mesh is assumed to run on a trusted
# transport (wireguard or an operator-controlled LAN); the key is treated like
# an SSH key because anyone holding it can inject health state.
#
# The whole block is opt-in: leave `key` empty to run with no mesh at all, which
# is the right default for a single-router deployment. Setting `join` without a
# `key` is a startup error rather than a silent no-op.
#
# bind_addr is the router's mesh interface address; it stays top-level because it
# is a per-host fact, like router_name.
bind_addr: 192.0.2.10
gossip:
  # base64 of a 16, 24 or 32 byte key. The value below decodes to the 32 ASCII
  # bytes "example-key-not-a-secret-32bytes" — a documentation placeholder, not a
  # secret. Generate a real one with: openssl rand -base64 32
  key: "ZXhhbXBsZS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM="
  bind_port: 7946
  join:
    - 192.0.2.11

listen_metrics: ":9414"

# Local control channel (issue #2): the unix socket `transitctl` talks to. It is
# authenticated with the gossip shared key above, so it exists only when a mesh
# key is set — an agent with no key opens no control socket at all. The channel is
# local-only in this MVP; remote invocation over the gossip mesh is documented as
# the reserved extension in internal/ctrl/PROTOCOL.md.
#
# The socket's directory is created 0750 and the socket 0660, owned by the agent's
# user (root). Omit this block to use the default /run/transitd/ctrl.sock.
control:
  socket_path: /run/transitd/ctrl.sock

# Decision tuning (all optional; the shown values are the defaults).
margin_ms: 10
win_cycles: 3
dwell: 5m
max_switches_per_hour: 4
settle: 60s
loss_drop_pct: 5
base_lp: 200
lp_step: 50

transits:
  - name: main
    import_map: MAIN-LOCAL-IN
    # The pin: this transit's own interface address, used as the `from`
    # selector of the startup route lookup and the `-I` of every ICMP probe.
    probe_source: 192.0.2.1
    # Canary destination probed via this transit.
    probe_target: 198.51.100.5
    # The egress the probes must actually leave through (assertion target).
    egress_interface: eth-transit
    probe_interval: 30s
    # This transit's upstream BGP peer, as it appears in `show bgp summary
    # json` on this router. It is what lets bgpwatch attribute a session state
    # to the transit; unset means the transit keeps its probe-only health view.
    bgp_neighbor: 198.51.100.5

  - name: backup
    import_map: BACKUP-LOCAL-IN
    probe_source: 192.0.2.2
    probe_target: 198.51.100.6
    egress_interface: eth-backup
    probe_interval: 30s
    bgp_neighbor: 198.51.100.6

# BGP/BFD state polling over vtysh (read-only `show` commands; 1 Hz max).
bgpwatch:
  enabled: true
  # A prefix-level view larger than this is an error, never a silent
  # truncation (a partial RIB would make "does peer X see prefix P" answer a
  # confident no).
  max_prefixes: 1000
  # Poll cadence; floored at 1s regardless of what is written here.
  interval: 5s

